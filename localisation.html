<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localisation | CO.FRA.GA</title>
    <link rel="stylesheet" href="localisation.css">
</head>

<body>

    <!-- Curseur -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>


    <!-- Navigation -->
    <header class="navbar">

        <a href="acceuil.html" class="logo">
            <img src="assets/images/logo cofraga.png" alt="Logo CO.FRA.GA">
        </a>

        <nav class="navigation">

            <a href="acceuil.html">Accueil</a>

            <a href="apropos.html">À propos</a>

            <a href="missions.html">Missions</a>

            <a href="localisation.html" class="active">
                Localisation
            </a>

            <a href="temoignage.html">Témoignages</a>

            <a href="gouvernance.html">Gouvernance</a>

            <a href="contact.html">Contact</a>

        </nav>

    </header>


    <!-- Section localisation -->
    <main>

        <section class="localisation">

            <div class="localisation-content">


                <!-- Partie gauche -->
                <div class="localisation-info">

                    <span class="label">
                        NOTRE LOCALISATION
                    </span>

                    <h1>
                        Où nous
                        <span>trouver</span>
                    </h1>

                    <p class="description">
                        La CO.FRA.GA est basée à Libreville,
                        au Gabon, et œuvre au service des
                        communautés africaines.
                    </p>


                    <div class="address">

                        <div class="address-icon">
                            📍
                        </div>

                        <div class="address-text">

                            <h3>
                                Notre adresse
                            </h3>

                            <p>
                                Libreville, Gabon
                            </p>

                        </div>

                    </div>


                    <a
                        href="https://www.google.com/maps/search/?api=1&query=Libreville+Gabon"
                        target="_blank"
                        class="map-button"
                    >
                        Voir sur Google Maps
                    </a>

                </div>


                <!-- Partie droite : carte -->
                <div class="map">

                    <iframe
                        src="https://www.google.com/maps?q=Libreville,+Gabon&output=embed"
                        loading="lazy"
                        allowfullscreen
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>

                </div>

            </div>

        </section>

    </main>


    <!-- Curseur -->
    <script>

        const cursor = document.querySelector(".cursor");
        const follower = document.querySelector(".cursor-follower");

        document.addEventListener("mousemove", function(event) {

            cursor.style.left = event.clientX + "px";
            cursor.style.top = event.clientY + "px";

            follower.style.left = event.clientX + "px";
            follower.style.top = event.clientY + "px";

        });

    </script>

    
    <script src="script.js"></script>

</body>

</html>
